name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    name: Windows Setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare bundled Node runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\runtime-win | Out-Null
          curl -fsSL -o node.zip https://nodejs.org/dist/v22.14.0/node-v22.14.0-win-x64.zip
          Expand-Archive node.zip -DestinationPath node-extract
          Copy-Item node-extract\node-v22.14.0-win-x64\node.exe installer\runtime-win\node.exe
      - name: Install Inno Setup
        shell: pwsh
        run: |
          curl -fsSL -o innosetup.exe https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
          Start-Process .\innosetup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
      - name: Build Setup.exe
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ImaLocalHub.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/ImaLocalHub-Setup-*.exe

  macos:
    name: macOS dmg (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Build dmg
        run: |
          chmod +x installer/macos/build-dmg.sh
          installer/macos/build-dmg.sh ${{ matrix.arch }} 22.14.0 "ImaLocalHub-1.0.0-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: ImaLocalHub-1.0.0-macos-*.dmg

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist-all
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" dist-all/* \
            --title "ImaLocalHub ${GITHUB_REF#refs/tags/}" \
            --notes "Windows: ImaLocalHub-Setup-*.exe（双击安装，内嵌 Node 运行时）
          macOS: ImaLocalHub-*.dmg（arm64 = Apple Silicon / x64 = Intel，拖入应用程序即用）
          详见 README" \
            --draft=false
